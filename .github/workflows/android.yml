name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # タグ push 時にリリースへ APK を添付するため

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log

      # コンパイルエラーをアノテーションとして出す (Actions の画面や API から原因を読めるように)
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |^> |What went wrong|FAILED" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Rename APK
        run: |
          VERSION=$(git describe --tags --always)
          cp app/build/outputs/apk/debug/app-debug.apk "OBDMeter-${VERSION}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OBDMeter-debug-apk
          path: OBDMeter-*-debug.apk
          retention-days: 30

      # v0.1.0 のようなタグを push したときは GitHub Releases にも APK を添付
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OBDMeter-*-debug.apk
