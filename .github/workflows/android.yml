name: Android Build

on:
  push:
    branches: [ main, master, web ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # タグ push 時にリリースへ APK を添付するため

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log

      # 普段使う版 (最適化あり・起動が速い)
      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee -a build.log

      # コンパイルエラーをアノテーションとして出す (Actions の画面や API から原因を読めるように)
      - name: Report compile errors
        if: failure()
        run: |
          # 1 つのアノテーションに改行 (%0A) でまとめる (件数制限があるため)
          msg=$( (grep -E "^e: " build.log; grep -A4 "What went wrong" build.log) | head -40 \
            | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Rename APK
        run: |
          VERSION=$(git describe --tags --always)
          cp app/build/outputs/apk/debug/app-debug.apk "OBDMeter-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "OBDMeter-${VERSION}-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OBDMeter-debug-apk
          path: OBDMeter-*-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OBDMeter-release-apk
          path: OBDMeter-*-release.apk
          retention-days: 30

      # v0.1.0 のようなタグを push したときは GitHub Releases にも APK を添付
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OBDMeter-*-release.apk
            OBDMeter-*-debug.apk
