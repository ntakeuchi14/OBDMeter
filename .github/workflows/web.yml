name: Web Build

on:
  push:
    branches: [ main, web ]
  workflow_dispatch:

permissions:
  contents: write   # gh-pages ブランチへ公開するため

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download fonts (Japanese)
        run: |
          F=app/src/wasmJsMain/resources/fonts
          mkdir -p $F
          # 取れなかったフォントは、公開中のサイト (gh-pages) に入っているものを使う (配布元が落ちていてもビルドできるように)
          fallback() {
            git fetch -q --depth 1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
            git show origin/gh-pages:fonts/$1 > $F/$1
          }
          get() { curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o $F/$1 "$2" || fallback $1; }
          get NotoSansJP-Regular.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/JP/NotoSansJP-Regular.otf
          get NotoSansMono-Regular.ttf https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansMono/hinted/ttf/NotoSansMono-Regular.ttf
          # Android の標準フォント (Roboto) と同じ文字の形・行の高さにするため
          if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o roboto.zip https://github.com/googlefonts/roboto/releases/download/v2.138/roboto-unhinted.zip; then
            unzip -j -o roboto.zip Roboto-Regular.ttf Roboto-Medium.ttf Roboto-Bold.ttf -d $F
          else
            for f in Roboto-Regular.ttf Roboto-Medium.ttf Roboto-Bold.ttf; do fallback $f; done
          fi
          ls -la $F

      - name: Build web app (WebAssembly)
        run: |
          sed -i "s/__VERSION__/web-${GITHUB_RUN_NUMBER}/" app/src/wasmJsMain/resources/index.html
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:wasmJsBrowserDistribution 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          msg=$( (grep -E "^e: " build.log; grep -A6 "What went wrong" build.log) | sed -e "s#file://$PWD/##" | head -60 \
            | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/dist/wasmJs/productionExecutable
          force_orphan: true
